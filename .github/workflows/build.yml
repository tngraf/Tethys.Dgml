name: Build

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Test on multiple OS and .NET versions
        # os: [ubuntu-latest, windows-latest, macos-latest]
        # dotnet-version: ['8.0.x', '10.0.x']

        # Start small: only Windows, only 8.0.x
        os: [ubuntu-latest, windows-latest, macos-latest]
        dotnet-version: ['8.0.x']
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build library
      run: dotnet build --configuration Release --no-restore
    
    - name: Run demo
      run: dotnet run --project Tethys.Dgml.Demo --configuration Release --no-build
      working-directory: .
    
    # - name: Verify DGML output files exist
    #  shell: bash
    #  run: |
    #    if [ ! -f "Tethys.Dgml.Demo/bin/Release/net5.0/VerySimpleExample.dgml" ] && [ ! -f "Tethys.Dgml.Demo/bin/Release/net8.0/VerySimpleExample.dgml" ]; then
    #      echo "Error: DGML output files not generated"
    #      exit 1
    #    fi
    #    echo "DGML output files generated successfully"

  pack:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build library
      run: dotnet build --configuration Release --no-restore
    
    - name: Create NuGet package
      run: dotnet pack Tethys.Dgml/Tethys.Dgml.csproj --configuration Release --no-build --output nupkg
    
    #- name: Publish to NuGet
    #  run: dotnet nuget push nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate
    #  if: env.NUGET_API_KEY != ''
    #  env:
    #    NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    
    - name: Upload NuGet package as artifact
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package
        path: nupkg/
